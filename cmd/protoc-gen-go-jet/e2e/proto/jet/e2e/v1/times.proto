// Times covers `google.protobuf.Timestamp` and `google.protobuf.Duration`
// round-trips. Timestamp -> TIMESTAMPTZ, Duration -> BIGINT ns.
syntax = "proto3";

package jet.e2e.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "gojet/v1/options.proto";

// Times exercises timestamp + duration persistence.
message Times {
  option (gojet.v1.table) = {
    name: "times"
    primary_key: ["id"]
  };

  string id = 1 [(gojet.v1.column) = {immutable: true}];

  // Timestamp -> TIMESTAMPTZ. Nanosecond precision round-trip.
  google.protobuf.Timestamp event_at = 2 [(gojet.v1.column) = {default_expr: "now()"}];

  // `nullable: true` is rejected by resolveColumn until the mapper
  // grows pointer-aware scalar handling (go-jet picks *time.Time for a
  // nullable TIMESTAMPTZ column; the current value-type mapper can't
  // compile against that). Add a `nullable_event_at` field here once
  // the feature lands to cover the nullable-timestamp case.

  // Duration -> BIGINT nanoseconds. Zero, negative, large values.
  google.protobuf.Duration ttl = 4 [(gojet.v1.column) = {}];

  // Orderable timestamp — participates in List pagination + tie-breaker.
  google.protobuf.Timestamp created_at = 5 [(gojet.v1.column) = {
    orderable: true
    default_expr: "now()"
  }];

  // Repeated Timestamp lands in TIMESTAMPTZ[] via jettypes.TimestampArray —
  // a named []time.Time type with Scan/Value methods the plugin
  // threads through jetgen.ColumnOverrides (pq itself refuses to
  // scan TIMESTAMPTZ[] into time.Time). Sub-μs nanoseconds truncate
  // at the PG TIMESTAMPTZ floor; µs precision round-trips exact.
  repeated google.protobuf.Timestamp checkpoints = 6 [(gojet.v1.column) = {}];
  // Repeated Duration stays as BIGINT[] of nanoseconds — PG has no
  // DURATION type, and Duration scalars already persist as BIGINT,
  // so the repeated case is consistent with the scalar case.
  repeated google.protobuf.Duration backoffs = 7 [(gojet.v1.column) = {}];
}
